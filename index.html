      // READY MEAL CUSTOMIZATION CALCULATIONS
      const mealCustomizationCalculation = useMemo(() => {
        if (!customizeMeal) return null;
        let basePrice = customizeMeal.price;
        let baseProtein = customizeMeal.protein;
        let baseCalories = customizeMeal.calories;

        let portionMult = 1.0;
        let portionPriceAdd = 0;
        if (customPortion === 'Athlete Pro (+35% P)') {
          portionMult = 1.35;
          portionPriceAdd = 50;
        } else if (customPortion === 'Bulking Beast (+70% P)') {
          portionMult = 1.7;
          portionPriceAdd = 90;
        } else if (customPortion === 'Lean Cut (-10%)') {
          portionMult = 0.9;
          portionPriceAdd = -15;
        }

        let boosterProtein = 0;
        let boosterCalories = 0;
        let boosterPrice = 0;

        customBoosters.forEach(b => {
          boosterProtein += b.protein;
          boosterCalories += b.calories;
          boosterPrice += b.price;
        });

        let cookingCalories = customCooking === 'Light Curry Gravy (+₹20)' ? 50 : (customCooking === 'Wok Tossed' ? 30 : 0);
        let cookingPrice = customCooking === 'Light Curry Gravy (+₹20)' ? 20 : 0;

        const totalProtein = Math.round(baseProtein * portionMult + boosterProtein);
        const totalCalories = Math.round(baseCalories * portionMult + boosterCalories + cookingCalories);
        const totalPrice = Math.round(basePrice + portionPriceAdd + boosterPrice + cookingPrice);

        return { totalProtein, totalCalories, totalPrice };
      }, [customizeMeal, customPortion, customCooking, customBoosters]);

      const handleAddCustomizedMealToCart = () => {
        if (!customizeMeal || !mealCustomizationCalculation) return;
        const boosterNames = customBoosters.map(b => b.name).join(', ');
        const exclusionText = customExclusions.length > 0 ? ` • Excluded: ${customExclusions.join(', ')}` : '';
        const notesText = customNotes.trim() ? ` • Note: ${customNotes}` : '';

        const item = {
          id: 'custom-meal-' + Date.now(),
          name: `${customizeMeal.name} (${customPortion.split(' ')[0]})`,
          type: 'meal',
          price: mealCustomizationCalculation.totalPrice,
          protein: mealCustomizationCalculation.totalProtein,
          calories: mealCustomizationCalculation.totalCalories,
          quantity: 1,
          image: customizeMeal.image,
          details: `${customPortion} • ${customCooking} • ${customSpice}${boosterNames ? ' • Boosters: ' + boosterNames : ''}${exclusionText}${notesText}`
        };

        addToCart(item);
        setCustomizeMeal(null);
        setIsCartOpen(true);

            return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...item, quantity: 1 }];
        });
        showToast(`Added "${item.name}" to cart!`);
        if (window.confetti) {
          window.confetti({ particleCount: 30, spread: 60, origin: { y: 0.85, x: 0.9 } });
        }
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQ = item.quantity + delta;
            return newQ > 0 ? { ...item, quantity: newQ } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
        showToast('Item removed from cart');
      };

      // CART TOTALS
      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      }, [cart]);

      const cartProtein = useMemo(() => {
        return cart.reduce((acc, item) => acc + ((item.protein || 0) * item.quantity), 0);
      }, [cart]);

      const cartCalories = useMemo(() => {
        return cart.reduce((acc, item) => acc + ((item.calories || 0) * item.quantity), 0);
      }, [cart]);

      const discountAmount = useMemo(() => {
        if (!appliedCoupon) return 0;
        const coupon = COUPONS.find(c => c.code === appliedCoupon);
        if (!coupon || subtotal < coupon.minOrder) return 0;
        if (coupon.flatDiscount) return coupon.flatDiscount;
        if (coupon.discountPercent) {
          const disc = Math.round((subtotal * coupon.discountPercent) / 100);
          return coupon.maxDiscount ? Math.min(disc, coupon.maxDiscount) : disc;
        }
        return 0;
      }, [appliedCoupon, subtotal]);

      const deliveryFee = useMemo(() => {
        if (subtotal === 0) return 0;
        if (appliedCoupon === 'FREESHIP' && subtotal >= 250) return 0;
        return 40;
      }, [appliedCoupon, subtotal]);

      const taxes = useMemo(() => {
        return Math.round((subtotal - discountAmount) * 0.05);
      }, [subtotal, discountAmount]);

      const grandTotal = useMemo(() => {
        if (subtotal === 0) return 0;
        return Math.max(0, subtotal - discountAmount + deliveryFee + taxes);
      }, [subtotal, discountAmount, deliveryFee, taxes]);

      const handleApplyCoupon = (code) => {
        const found = COUPONS.find(c => c.code.toUpperCase() === code.toUpperCase());
        if (!found) {
          showToast('❌ Invalid coupon code');
          return;
        }
        if (subtotal < found.minOrder) {
          showToast(`⚠️ Minimum order of ₹${found.minOrder} required for ${found.code}`);
          return;
        }
        setAppliedCoupon(found.code);
        showToast(`🎉 Coupon ${found.code} applied successfully!`);
      };

      // ADMIN ORDER NAVIGATION OPERATIONS
      const handleUpdateOrderStatus = (orderId, newStatus) => {
        setOrdersList(prev => prev.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
        showToast(`Order #${orderId} moved to: ${newStatus}`);
      };

      const filteredAdminOrders = useMemo(() => {
        return ordersList.filter(o => {
          if (adminOrderFilter !== 'all' && o.status.toLowerCase() !== adminOrderFilter.toLowerCase()) return false;
          if (adminSearchQuery.trim()) {
            const q = adminSearchQuery.toLowerCase();
            return o.id.toLowerCase().includes(q) || o.customerName.toLowerCase().includes(q) || o.customerPhone.includes(q);
          }
          return true;
        });
      }, [ordersList, adminOrderFilter, adminSearchQuery]);

      // FILTERED MEALS
      const filteredMeals = useMemo(() => {
        return MEALS.filter(meal => {
          if (vegOnly && !meal.isVeg) return false;
          if (selectedCategory !== 'all' && !meal.tags.includes(selectedCategory)) return false;
          if (meal.protein < minProtein) return false;
          if (meal.price > maxPrice) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = meal.name.toLowerCase().includes(q);
            const matchDesc = meal.description.toLowerCase().includes(q);
            const matchIng = meal.ingredients.some(ing => ing.toLowerCase().includes(q));
            if (!matchName && !matchDesc && !matchIng) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'protein-high') return b.protein - a.protein;
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'calories-low') return a.calories - b.calories;
          return b.rating - a.rating;
        });
      }, [selectedCategory, vegOnly, minProtein, maxPrice, sortBy, searchQuery]);

      // SMART AI
      const runAiMatcher = () => {
        let recProtein = Math.round(aiWeight * 2.1);
        let recCalories = Math.round(aiWeight * 32);
        let comboMeal = MEALS[0];
        let comboShake = SHAKES[0];

        setAiResult({
          recProtein,
          recCalories,
          comboMeal,
          comboShake,
          totalComboProtein: comboMeal.protein + comboShake.protReg,
          totalComboCalories: comboMeal.calories + comboShake.calReg,

              <span className="text-fitbite-400 font-bold">✓</span>
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          {/* TOP NAVBAR */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20 gap-4">

                <div

                    </span>
                    <p className="text-[10px] font-bold tracking-wider text-slate-500 uppercase">Personalized Protein • Real Results</p>
                  </div>

                <nav className="hidden lg:flex items-center gap-1">

            {/* VIEW: HOME */}
            {activeTab === 'home' && (

                {/* HERO SECTION */}
                <section className="relative overflow-hidden bg-gradient-to-b from-white via-fitbite-50/30 to-slate-50 pt-12 pb-20 border-b border-slate-200/80">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                      
                      {/* Left Hero Copy */}

                <section className="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                          key={boost.id}
                          onClick={() => {
                            if (isAdded) setCustomBoosters(customBoosters.filter(b => b.id !== boost.id));
                            else setCustomBoosters([...customBoosters, boost]);

          {/* AUTH MODAL (Sign In & Sign Up) */}

                <div className="flex justify-between items-center border-b border-slate-100 pb-3">

                    </div>

                    <button

                      className="w-full bg-fitbite-600 hover:bg-fitbite-700 text-white font-bold py-3 rounded-xl shadow-md text-xs"

                          Athlete

                          onClick={() => {
                            setUser(INITIAL_USERS[1]);
                            setIsAuthModalOpen(false);
                            showToast('Logged in as Rahul (Cut Phase)');
                          }}

                          Cut Phase
                        </button>

                          type="button"
                          onClick={() => {
                            setUser(INITIAL_USERS[2]);
                            setIsAuthModalOpen(false);

                            showToast('Logged in as Admin Ops');
                          }}

                          <option value="Lean Tone">Lean Tone</option>

                          <option value="Vegan">Vegan</option>

                    </button>
                  </div>

                      items: [...cart],
                      itemTotal: subtotal,
                      discount: discountAmount,
                      taxes: taxes,

                  </ul>
