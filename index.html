      { id: 'u3', name: 'Priya Nair', email: 'priya@fitbite.fit', goal: 'Lean Tone', targetProt: 105, targetCal: 1600, role: 'Fitness Enthusiast' }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('home'); // home, menu, builder, shakes, quote, offers, orders, profile
      const [user, setUser] = useState(USERS[0]);
      
      // Cart & Favorites State
      const [cart, setCart] = useState([

          details: 'Standard Portion • Char-Grilled'
        },

          id: 'item-demo-2',
          name: 'Double Chocolate Whey Shake (Large)',
          type: 'shake',
          price: 229,
          protein: 38,
          calories: 330,
          quantity: 1,
          image: 'https://images.unsplash.com/photo-1577805947697-89e18249d767?auto=format&fit=crop&w=800&q=80',
          details: 'Large (500ml) • Skimmed Milk'

      const [favorites, setFavorites] = useState(['prod-1', 'prod-3', 'shake-1']);
      const [appliedCoupon, setAppliedCoupon] = useState('WELCOME20');
      const [couponInput, setCouponInput] = useState('');
      
      // UI Modals
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isPaymentModalOpen, setIsPaymentModalOpen] = useState(false);
      const [isTrackingModalOpen, setIsTrackingModalOpen] = useState(false);
      const [isAIModalOpen, setIsAIModalOpen] = useState(false);
      const [selectedMealForModal, setSelectedMealForModal] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [toastMessage, setToastMessage] = useState(null);

      // Menu Filters
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [vegOnly, setVegOnly] = useState(false);
      const [minProtein, setMinProtein] = useState(20);
      const [maxPrice, setMaxPrice] = useState(400);
      const [sortBy, setSortBy] = useState('popular');

      // Custom Builder State
      const [builderState, setBuilderState] = useState({
        protein: BUILDER_DATA.proteins[0],
        base: BUILDER_DATA.bases[0],
        veggies: [BUILDER_DATA.veggies[0], BUILDER_DATA.veggies[1]],
        cookingStyle: BUILDER_DATA.cookingStyles[0],
        spiceLevel: BUILDER_DATA.spiceLevels[1],
        portion: BUILDER_DATA.portions[0],
        bowlName: "My Power Muscle Bowl"
      });

      // Smart AI State
      const [aiGoal, setAiGoal] = useState('muscle_gain');
      const [aiDiet, setAiDiet] = useState('non_veg');
      const [aiActivity, setAiActivity] = useState('moderate');
      const [aiWeight, setAiWeight] = useState(72);
      const [aiResult, setAiResult] = useState(null);

      // Live Order Tracking State
      const [trackingOrder, setTrackingOrder] = useState({
        id: 'ORD-98421',
        statusIndex: 2, // 0: Placed, 1: Kitchen, 2: Lab Verified, 3: Out for Delivery, 4: Delivered
        riderName: 'Vikram Singh',
        riderPhone: '+91 98451 22910',
        etaMinutes: 14,
        totalAmount: 439
      });

      // Trigger Toast
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      // Toggle Favorite
      const toggleFavorite = (id) => {
        if (favorites.includes(id)) {
          setFavorites(favorites.filter(f => f !== id));
          showToast('Removed from Favorites');
        } else {
          setFavorites([...favorites, id]);
          showToast('❤️ Saved to Favorites!');
        }
      };

      // Cart Operations
      const addToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...item, quantity: 1 }];
        });
        showToast(`Added "${item.name}" to cart!`);
        if (window.confetti) {
          window.confetti({ particleCount: 30, spread: 60, origin: { y: 0.85, x: 0.9 } });
        }
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if (item.id === id) {
            const newQ = item.quantity + delta;
            return newQ > 0 ? { ...item, quantity: newQ } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(i => i.id !== id));
        showToast('Item removed from cart');
      };

      // Cart Calculations
      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      }, [cart]);

      const cartProtein = useMemo(() => {
        return cart.reduce((acc, item) => acc + ((item.protein || 0) * item.quantity), 0);
      }, [cart]);

      const cartCalories = useMemo(() => {
        return cart.reduce((acc, item) => acc + ((item.calories || 0) * item.quantity), 0);
      }, [cart]);

      const discountAmount = useMemo(() => {
        if (!appliedCoupon) return 0;
        const coupon = COUPONS.find(c => c.code === appliedCoupon);
        if (!coupon || subtotal < coupon.minOrder) return 0;
        if (coupon.flatDiscount) return coupon.flatDiscount;
        if (coupon.discountPercent) {
          const disc = Math.round((subtotal * coupon.discountPercent) / 100);
          return coupon.maxDiscount ? Math.min(disc, coupon.maxDiscount) : disc;
        }
        return 0;
      }, [appliedCoupon, subtotal]);

      const deliveryFee = useMemo(() => {
        if (subtotal === 0) return 0;
        if (appliedCoupon === 'FREESHIP' && subtotal >= 250) return 0;
        return 40;
      }, [appliedCoupon, subtotal]);

      const taxes = useMemo(() => {
        return Math.round((subtotal - discountAmount) * 0.05);
      }, [subtotal, discountAmount]);

      const grandTotal = useMemo(() => {
        if (subtotal === 0) return 0;
        return Math.max(0, subtotal - discountAmount + deliveryFee + taxes);
      }, [subtotal, discountAmount, deliveryFee, taxes]);

      // Apply Coupon
      const handleApplyCoupon = (code) => {
        const found = COUPONS.find(c => c.code.toUpperCase() === code.toUpperCase());
        if (!found) {
          showToast('❌ Invalid coupon code');
          return;
        }
        if (subtotal < found.minOrder) {
          showToast(`⚠️ Minimum order of ₹${found.minOrder} required for ${found.code}`);
          return;
        }
        setAppliedCoupon(found.code);
        showToast(`🎉 Coupon ${found.code} applied successfully!`);
      };

      // Custom Builder Live Calculations
      const builderCalculations = useMemo(() => {
        const p = builderState.protein;
        const b = builderState.base;
        const vList = builderState.veggies;
        const cStyle = builderState.cookingStyle;
        const mult = builderState.portion.mult;

        const totalProtein = Math.round((p.protein * mult) + b.protein + vList.reduce((s, v) => s + v.protein, 0));
        const totalCalories = Math.round((p.calories * mult) + b.calories + vList.reduce((s, v) => s + v.calories, 0) + cStyle.extraCalories);
        const totalCarbs = Math.round((p.carbs * mult) + b.carbs + vList.reduce((s, v) => s + v.carbs, 0));
        const totalFats = Math.round((p.fats * mult) + b.fats + vList.reduce((s, v) => s + v.fats, 0));
        const totalPrice = Math.round((p.price * mult) + b.price + vList.reduce((s, v) => s + v.price, 0) + cStyle.price);

        return { totalProtein, totalCalories, totalCarbs, totalFats, totalPrice };
      }, [builderState]);

      const addCustomMealToCart = () => {
        const item = {
          id: 'custom-' + Date.now(),
          name: builderState.bowlName || 'Chef Custom Power Bowl',
          type: 'custom',
          price: builderCalculations.totalPrice,
          protein: builderCalculations.totalProtein,
          calories: builderCalculations.totalCalories,
          carbs: builderCalculations.totalCarbs,
          fats: builderCalculations.totalFats,
          quantity: 1,
          image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80',
          details: `${builderState.protein.name} + ${builderState.base.name} • ${builderState.cookingStyle.name} (${builderState.spiceLevel.name})`
        };
        addToCart(item);
        setIsCartOpen(true);
      };

      // Filtered Meals
      const filteredMeals = useMemo(() => {
        return MEALS.filter(meal => {
          if (vegOnly && !meal.isVeg) return false;
          if (selectedCategory !== 'all' && !meal.tags.includes(selectedCategory)) return false;
          if (meal.protein < minProtein) return false;
          if (meal.price > maxPrice) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const matchName = meal.name.toLowerCase().includes(q);
            const matchDesc = meal.description.toLowerCase().includes(q);
            const matchIng = meal.ingredients.some(ing => ing.toLowerCase().includes(q));
            if (!matchName && !matchDesc && !matchIng) return false;
          }
          return true;
        }).sort((a, b) => {
          if (sortBy === 'protein-high') return b.protein - a.protein;
          if (sortBy === 'price-low') return a.price - b.price;
          if (sortBy === 'price-high') return b.price - a.price;
          if (sortBy === 'calories-low') return a.calories - b.calories;
          return b.rating - a.rating;
        });
      }, [selectedCategory, vegOnly, minProtein, maxPrice, sortBy, searchQuery]);

      // Smart AI Calculation
      const runAiMatcher = () => {
        let recProtein = 135;
        let recCalories = 2100;
        let comboMeal = MEALS[0];
        let comboShake = SHAKES[0];

        if (aiGoal === 'muscle_gain') {
          recProtein = Math.round(aiWeight * 2.1);
          recCalories = Math.round(aiWeight * 33);
          comboMeal = aiDiet === 'vegetarian' ? MEALS[1] : MEALS[7];
          comboShake = SHAKES[0];
        } else if (aiGoal === 'fat_loss') {
          recProtein = Math.round(aiWeight * 1.8);
          recCalories = Math.round(aiWeight * 24);
          comboMeal = aiDiet === 'vegetarian' ? MEALS[5] : MEALS[8];
          comboShake = SHAKES[2];
        } else if (aiGoal === 'lean_tone') {
          recProtein = Math.round(aiWeight * 1.9);
          recCalories = Math.round(aiWeight * 28);
          comboMeal = aiDiet === 'vegetarian' ? MEALS[1] : MEALS[0];
          comboShake = SHAKES[1];
        } else {
          recProtein = Math.round(aiWeight * 2.3);
          recCalories = Math.round(aiWeight * 38);
          comboMeal = MEALS[7];
          comboShake = SHAKES[5];
        }

        setAiResult({
          recProtein,
          recCalories,
          comboMeal,
          comboShake,
          totalComboProtein: comboMeal.protein + (comboShake.protLg || comboShake.protReg),
          totalComboCalories: comboMeal.calories + (comboShake.calLg || comboShake.calReg),
          comboPrice: comboMeal.price + (comboShake.priceReg || 179) - 40 // 40 discount on combo
        });
      };

      const addAiComboToCart = () => {
        if (!aiResult) return;
        addToCart({
          id: aiResult.comboMeal.id,
          name: aiResult.comboMeal.name,
          type: 'meal',
          price: aiResult.comboMeal.price,

          calories: aiResult.comboMeal.calories,
          image: aiResult.comboMeal.image,
          details: 'Smart AI Recommended Meal'

        addToCart({
          id: aiResult.comboShake.id + '-combo',
          name: aiResult.comboShake.name,
          type: 'shake',
          price: aiResult.comboShake.priceReg,
          protein: aiResult.comboShake.protReg,

          details: 'Smart AI Recommended Shake'

                    { id: 'home', label: 'Home' },

                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </nav>

                {/* RIGHT ACTIONS: Search, Favorites, Cart, Profile */}
                <div className="flex items-center gap-3">
                  
                  {/* Search Bar Input */}
                  <div className="relative hidden md:block w-44 lg:w-52">
                    <input
                      type="text"
                      placeholder="Search high-protein..."
                      value={searchQuery}
                      onChange={(e) => {
                        setSearchQuery(e.target.value);
                        if (activeTab !== 'menu') setActiveTab('menu');
                      }}
                      className="w-full bg-slate-100 border border-slate-200 rounded-full pl-8 pr-3 py-1.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-fitbite-500 focus:bg-white"

                    <span className="absolute left-2.5 top-2 text-slate-400 text-xs">🔍</span>

                      setActiveTab('menu');
                      showToast(`You have ${favorites.length} saved meals`);

                    className="relative p-2.5 rounded-xl text-slate-700 hover:bg-slate-100 hover:text-red-600 transition-colors"
                    title="Favorites"
                  >
                    <span className="text-lg">❤️</span>
                    {favorites.length > 0 && (
                      <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-4 h-4 rounded-full flex items-center justify-center">
                        {favorites.length}
                      </span>
                    )}
                  </button>

                  {/* Cart Drawer Trigger */}
                  <button
                    onClick={() => setIsCartOpen(true)}
                    className="relative flex items-center gap-2 bg-fitbite-600 hover:bg-fitbite-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md shadow-fitbite-600/20 transition-all hover:scale-[1.02]"
                  >
                    <span>🛒</span>
                    <span className="hidden sm:inline">Cart</span>
                    <span className="bg-white text-fitbite-800 font-extrabold text-xs px-2 py-0.5 rounded-full ml-1">
                      {cart.reduce((s, i) => s + i.quantity, 0)}

                  {/* Demo User Switcher Dropdown */}

          {/* SIMULATED PAYMENT MODAL */}
          {isPaymentModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 space-y-6">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-lg font-black text-slate-900 font-display">Secure Checkout</h3>
                  <button onClick={() => setIsPaymentModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div className="bg-fitbite-50 p-4 rounded-2xl text-center">
                  <div className="text-xs text-fitbite-800 font-semibold">Total Payable Amount</div>
                  <div className="text-3xl font-black text-fitbite-900 font-display">₹{grandTotal}</div>
                </div>

                <div className="space-y-3">
                  <label className="text-xs font-bold text-slate-700">Select Payment Method</label>
                  {[
                    { id: 'upi', label: '📱 Instant UPI (GPay / PhonePe / Paytm)' },
                    { id: 'card', label: '💳 Credit / Debit Card' },
                    { id: 'cod', label: '💵 Cash on Delivery' }
                  ].map((p, i) => (
                    <div key={p.id} className={`p-3 rounded-xl border text-xs font-bold flex items-center gap-2 cursor-pointer ${i === 0 ? 'border-fitbite-600 bg-fitbite-50 text-fitbite-900' : 'border-slate-200 text-slate-700'}`}>
                      <input type="radio" name="pay" defaultChecked={i === 0} className="accent-fitbite-600" />
                      <span>{p.label}</span>
                    </div>
                  ))}
                </div>

                <button
                  onClick={() => {
                    setIsPaymentModalOpen(false);
                    setCart([]);
                    setIsTrackingModalOpen(true);
                    if (window.confetti) {
                      window.confetti({ particleCount: 80, spread: 80, origin: { y: 0.6 } });
                    }
                    showToast('🎉 Order placed successfully! Tracking live delivery.');
                  }}
                  className="w-full bg-fitbite-600 hover:bg-fitbite-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-fitbite-600/30 text-sm"
                >
                  Pay ₹{grandTotal} Securely & Place Order
                </button>
              </div>
            </div>
          )}

          {/* LIVE ORDER TRACKING MODAL */}
          {isTrackingModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-slate-200 space-y-6">
                <div className="flex justify-between items-start border-b border-slate-100 pb-3">
                  <div>
                    <span className="text-[10px] font-black uppercase text-fitbite-700">Live Kitchen & Delivery Feed</span>
                    <h3 className="text-xl font-black text-slate-900 font-display">Order #{trackingOrder.id}</h3>
                  </div>
                  <button onClick={() => setIsTrackingModalOpen(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                {/* ETA Banner */}
                <div className="bg-gradient-to-r from-fitbite-800 to-fitbite-600 text-white p-4 rounded-2xl flex items-center justify-between">
                  <div>
                    <div className="text-[10px] uppercase font-bold text-fitbite-200">Estimated Arrival</div>
                    <div className="text-2xl font-black font-display">{trackingOrder.etaMinutes} Mins Express</div>
                  </div>
                  <span className="text-3xl animate-bounce">🛵</span>
                </div>

                {/* Progress Steps Timeline */}
                <div className="space-y-4 text-xs">
                  {[
                    { step: 'Order Confirmed & Gram Scaled', icon: '✓', done: true },
                    { step: 'Kitchen Cooking & Zero-Oil Sear', icon: '🍳', done: true },
                    { step: 'Macro Verified & Lab Certificate Tagged', icon: '🔬', done: true },
                    { step: 'Rider Vikram Singh on Route to Indiranagar', icon: '🛵', done: false, active: true },
                    { step: 'Delivered at Doorstep', icon: '🏁', done: false }
                  ].map((s, i) => (
                    <div key={i} className="flex items-center gap-3">
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center font-black text-xs ${
                        s.done ? 'bg-fitbite-600 text-white' : (s.active ? 'bg-amber-500 text-white animate-pulse' : 'bg-slate-200 text-slate-500')
                      }`}>
                        {s.icon}
                      </div>
                      <span className={`font-semibold ${s.active ? 'text-slate-900 font-bold' : (s.done ? 'text-slate-800' : 'text-slate-400')}`}>
                        {s.step}
                      </span>
                    </div>
                  ))}
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 flex items-center justify-between text-xs">
                  <div>
                    <div className="font-bold text-slate-900">Rider: {trackingOrder.riderName}</div>
                    <div className="text-slate-500">{trackingOrder.riderPhone}</div>
                  </div>
                  <button onClick={() => showToast('📞 Calling Delivery Partner...')} className="bg-white border border-slate-300 px-3 py-1.5 rounded-xl font-bold text-slate-800">
                    Call Driver
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-300 pt-16 pb-12 border-t border-slate-800 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                
                <div className="space-y-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-xl bg-fitbite-500 text-slate-950 font-black flex items-center justify-center text-base">
                      FB
                    </div>
                    <span className="text-xl font-black text-white font-display">Fit<span className="text-fitbite-400">Bite</span></span>
                  </div>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    Precision-crafted high-protein nutrition, fresh calorie-verified meals, and whey smoothies tailored to your fitness goals.
                  </p>
                  <div className="text-[10px] text-fitbite-400 font-bold">
                    ✓ FSSAI Certified: #11223344556677
                  </div>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm mb-3">Quick Links</h4>
                  <ul className="space-y-2 text-xs text-slate-400">
                    <li><button onClick={() => setActiveTab('menu')} className="hover:text-white">Ready High-Protein Menu</button></li>
                    <li><button onClick={() => setActiveTab('builder')} className="hover:text-white">Custom Meal Builder</button></li>
                    <li><button onClick={() => setActiveTab('shakes')} className="hover:text-white">Whey Isolate Shakes</button></li>
                    <li><button onClick={() => setActiveTab('offers')} className="hover:text-white">Offers & Deals</button></li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm mb-3">Nutrition Standards</h4>
                  <ul className="space-y-2 text-xs text-slate-400">
                    <li>✓ 100% Lab Verified Macros</li>
                    <li>✓ Zero Added Refined Sugar</li>
                    <li>✓ High-Grade Cold-Pressed Oils</li>
                    <li>✓ Biodegradable Packaging</li>
                  </ul>
                </div>

                <div>
                  <h4 className="text-white font-bold text-sm mb-3">Get in Touch</h4>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    FitBite Nutrition HQ<br />
                    100ft Road, Indiranagar, Bengaluru<br />
                    Support: support@fitbite.fit
                  </p>
                </div>

              </div>

              <div className="pt-8 border-t border-slate-800 text-center text-xs text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div>© 2026 FitBite Nutrition Pvt Ltd. All rights reserved.</div>
                <div className="flex gap-4">
                  <span>Privacy Policy</span>
                  <span>Terms of Service</span>
                  <span>Macro Standards</span>
                </div>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
